name: Release APK

# Builds, signs and publishes the app when you push a version tag such as v1.4.
# You can also start it by hand (Actions tab -> Release APK -> Run workflow) as a dry run: it builds and signs the
# APK and keeps it as a downloadable workflow artifact, but publishes nothing.
#
# The signing key comes from four repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The signing secrets can be moved into this GitHub "Environment" and limited to the tags v* (Settings -> Environments ->
    # release), so that no other branch or workflow run can ever use them. Until then the repository secrets work as before.
    environment: release
    permissions:
      contents: write # only needed to create the GitHub Release
      id-token: write # lets the build prove where the APK came from (see the attest step)
      attestations: write
    env:
      # Public fingerprint of the certificate that signed the installed app. The build fails if the APK is signed by
      # anything else, because such an APK could not be installed over the existing app.
      EXPECTED_CERT_SHA256: DF:15:A0:B3:A7:31:31:32:6A:10:B5:49:34:D1:EE:A3:C2:A0:24:95:19:D2:28:31:2E:C3:72:61:85:F4:36:F7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^ *versionName "\(.*\)"/\1/p' app/build.gradle | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version} in app/build.gradle. Bump versionCode/versionName, commit, then tag again."
            exit 1
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::One or more signing secrets are missing. See the comment at the top of this workflow."
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${keystore}"
          export ANDROID_KEYSTORE_FILE="${keystore}"
          ./gradlew --no-daemon assembleRelease
          rm -f "${keystore}"

      - name: Show what was built
        run: |
          java -version
          ls -la app/build/outputs/apk/release/

      - name: Verify the APK is signed with the expected key
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${apk}" ]; then
            echo "::error::${apk} was not produced. The release build was probably not signed (check the signing secrets)."
            exit 1
          fi
          # Try each installed apksigner, newest first; some versions need a newer Java than others.
          for candidate in $(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -rV); do
            echo "Trying ${candidate}"
            rc=0
            APKSIGNER="${candidate}" bash tools/verify-apk-signature.sh "${apk}" "${EXPECTED_CERT_SHA256}" || rc=$?
            if [ "${rc}" -eq 0 ]; then
              exit 0
            fi
            if [ "${rc}" -eq 1 ]; then
              echo "::error::The APK is signed with a different key than expected. Check the keystore secret."
              exit 1
            fi
          done
          echo "::error::No installed apksigner could read the APK signature (see the output above)."
          exit 1

      - name: Name the APK and write its checksum
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then name="WatchingEye-${GITHUB_REF_NAME}"; else name="WatchingEye-manual-run${GITHUB_RUN_NUMBER}"; fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${name}.apk"
          (cd dist && sha256sum "${name}.apk" > "${name}.apk.sha256")
          cat "dist/${name}.apk.sha256"

      - name: Attest where the APK came from
        # Signed proof that this exact file was built from this repository by this workflow. Verify a download with:
        #   gh attestation verify WatchingEye-v1.6.apk --repo feerlessleadr/watching-eye-android-app
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Safe to re-run: if a release for this tag already exists, leave it alone instead of failing.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "A release for ${GITHUB_REF_NAME} already exists; not creating another one."
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "Watching Eye ${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Keep the APK as a workflow artifact (manual dry runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-apk
          path: dist/*
          retention-days: 14
